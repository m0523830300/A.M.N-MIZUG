<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="א.מ.ן בעלים">
<meta name="theme-color" content="#153E6F">
<link rel="manifest" href="manifest-owner.json">
<link rel="apple-touch-icon" href="icon-owner-180.png">
<link rel="icon" type="image/png" href="icon-owner-192.png">
<title>א.מ.ן מיזוג אוויר - ניהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#153E6F;
    --navy-deep:#0B2A50;
    --accent:#B7352A;
    --accent-soft:#FBEAE7;
    --amber:#D9820B;
    --amber-soft:#FBF0DE;
    --green:#178A4C;
    --green-soft:#E5F5EC;
    --bg:#F5F8F9;
    --card:#FFFFFF;
    --line:#E1E8EA;
    --text:#152026;
    --text-dim:#5C6E75;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    padding:0;
    min-height:100%;
    width:100%;
  }
  body{
    font-family:'Heebo',sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 60px;min-height:100dvh;}
  header{
    background:linear-gradient(135deg,var(--navy),var(--navy-deep));
    padding:28px 20px 22px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    left:-30px;top:-40px;
    width:160px;height:160px;
    border:2px solid rgba(255,255,255,.08);
    border-radius:50%;
  }
  header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.2px;}
  header p{margin:6px 0 0;font-size:13px;color:#AFC6CC;font-weight:500;}
  .switch-view-link{
    display:inline-block;margin-top:14px;font-size:12.5px;font-weight:700;
    color:#fff;background:rgba(255,255,255,.14);padding:7px 14px;border-radius:20px;
    text-decoration:none;position:relative;z-index:1;
  }
  .switch-view-link:hover{background:rgba(255,255,255,.22);}
  .stripe{
    height:4px;
    background:repeating-linear-gradient(90deg,var(--accent) 0 22px, transparent 22px 30px);
    opacity:.55;
  }

  .header-home-btn{
    display:none;margin-top:14px;border:1px solid rgba(255,255,255,.35);
    color:#fff;background:rgba(255,255,255,.12);padding:7px 14px;border-radius:20px;
    font-family:'Heebo',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;
    position:relative;z-index:1;
  }
  .header-home-btn:hover{background:rgba(255,255,255,.22);}
  .app-view{display:none;}
  .app-view.active{display:block;}
  .home-screen{padding:24px 20px 10px;}
  .home-intro{margin:0 0 16px;color:var(--text-dim);font-size:14px;}
  .home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .home-card{
    min-height:132px;border:1px solid var(--line);border-radius:16px;background:var(--card);
    padding:18px 15px;text-align:right;font-family:'Heebo',sans-serif;cursor:pointer;
    box-shadow:0 2px 8px rgba(11,42,80,.05);transition:transform .12s,border-color .12s,box-shadow .12s;
  }
  .home-card:hover{border-color:#B7C9DB;box-shadow:0 5px 16px rgba(11,42,80,.10);}
  .home-card:active{transform:scale(.98);}
  .home-card.primary{background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#fff;border:0;}
  .home-card.collection{border-right:5px solid var(--accent);}
  .home-icon{display:block;font-size:28px;line-height:1;margin-bottom:13px;}
  .home-title{display:block;font-size:17px;font-weight:800;}
  .home-desc{display:block;margin-top:5px;font-size:12.5px;color:var(--text-dim);line-height:1.45;}
  .home-card.primary .home-desc{color:#C9D8E6;}
  .view-back-row{margin:18px 20px 0;}
  .view-back-btn{
    border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;
    padding:8px 13px;font:700 13px 'Heebo',sans-serif;cursor:pointer;
  }
  @media(max-width:430px){.home-grid{grid-template-columns:1fr}.home-card{min-height:105px;}}

  .section-title{
    font-size:13px;font-weight:600;color:var(--text-dim);
    margin:26px 20px 10px;letter-spacing:.3px;
    display:flex;align-items:center;gap:8px;
  }
  .section-title .n{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--accent);
    background:var(--accent-soft);
    padding:2px 7px;border-radius:5px;
  }

  form{
    background:var(--card);
    margin:0 20px;
    border-radius:14px;
    padding:18px;
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(15,37,47,.04);
  }
  label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input, select, textarea{
    width:100%;
    font-family:'Heebo',sans-serif;
    font-size:15px;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#FBFCFD;
    color:var(--text);
    transition:border-color .15s;
  }
  input:focus, select:focus, textarea:focus{
    outline:none;border-color:var(--accent);background:#fff;
  }
  textarea{resize:vertical;min-height:64px;}
  button.submit{
    width:100%;
    margin-top:18px;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:14px;
    border-radius:10px;
    font-family:'Heebo',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  button.submit:active{transform:scale(.98);}
  button.submit:hover{background:#0C8578;}
  button.submit:disabled{background:#9FB4B7;cursor:default;}

  .tech-manager{
    background:var(--card);margin:0 20px;border-radius:14px;padding:16px 18px;
    border:1px solid var(--line);
  }
  .tech-manager .current-list{
    display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;
  }
  .tech-chip{
    font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;
    background:var(--accent-soft);color:var(--accent);
  }
  .tech-add-row{display:flex;gap:8px;flex-wrap:wrap;}
  .tech-add-row input{flex:1;min-width:110px;}
  .tech-add-row button{
    background:var(--navy);color:#fff;border:none;padding:0 16px;border-radius:9px;
    font-family:'Heebo',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .tech-add-row button:hover{background:var(--navy-deep);}

  .tabs{display:flex;gap:8px;margin:18px 20px 0;}
  .tab{
    flex:1;text-align:center;padding:9px 0;border-radius:20px;
    font-size:13px;font-weight:700;cursor:pointer;
    border:1.5px solid var(--line);color:var(--text-dim);background:#fff;
  }
  .tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .toolbar{
    display:flex;justify-content:space-between;align-items:center;
    margin:14px 20px 10px;
  }
  .refresh{
    background:none;border:1.5px solid var(--line);
    color:var(--text-dim);font-family:'Heebo',sans-serif;
    font-size:13px;font-weight:600;
    padding:7px 12px;border-radius:20px;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .refresh:hover{border-color:var(--accent);color:var(--accent);}
  .refresh svg{width:14px;height:14px;}

  .list{margin:0 20px;display:flex;flex-direction:column;gap:10px;}
  .call{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    position:relative;
    padding-right:20px;
    overflow:hidden;
  }
  .call::before{
    content:"";
    position:absolute;right:0;top:0;bottom:0;width:5px;
  }
  .call.status-new::before{background:var(--navy);}
  .call.status-progress::before{background:var(--accent);}
  .call.status-followup::before{background:var(--amber);}
  .call.status-done::before{background:var(--green);}
  .call.status-cancelled::before{background:#8A9BA3;}

  .call-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .call-name{font-weight:700;font-size:15px;}
  .badge{
    font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:20px;
    white-space:nowrap;
  }
  .badge.status-new{background:#EAF0F2;color:var(--navy);}
  .badge.status-progress{background:var(--accent-soft);color:var(--accent);}
  .badge.status-followup{background:var(--amber-soft);color:var(--amber);}
  .badge.status-done{background:var(--green-soft);color:var(--green);}
  .badge.status-cancelled{background:#EDEFF1;color:#5C6E75;text-decoration:line-through;}

  .call-meta{font-size:13px;color:var(--text-dim);margin-top:4px;line-height:1.6;}

  .wait-badge{
    display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;
    padding:3px 10px;border-radius:20px;
  }
  .wait-badge.wait-new{background:#EAF0F2;color:var(--navy);}
  .wait-badge.wait-soon{background:var(--amber-soft);color:var(--amber);}
  .wait-badge.wait-urgent{background:#FBE4E1;color:#C0392B;}
  .call-meta b{color:var(--text);font-weight:600;}
  .call-meta a{color:var(--navy);font-weight:600;text-decoration:none;}
  .call-meta a:hover{text-decoration:underline;}
  .edit-row{display:flex;gap:8px;margin-top:10px;}
  .edit-btn, .photo-btn{
    flex:1;border:1.5px solid var(--line);background:#fff;color:var(--navy);
    padding:8px;border-radius:9px;font-family:'Heebo',sans-serif;font-size:12.5px;
    font-weight:700;cursor:pointer;
  }
  .edit-btn:hover, .photo-btn:hover{border-color:var(--navy);}
  .owner-photo-row{margin-top:8px;}
  .owner-photo-row a{
    font-size:12px;font-weight:700;color:var(--navy);text-decoration:none;
    background:var(--accent-soft);border-radius:20px;padding:5px 12px;
  }

  .overlay{
    position:fixed;inset:0;background:rgba(15,37,47,.45);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.show{display:flex;}
  .edit-sheet{
    background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;
    padding:22px 20px 26px;max-height:88vh;overflow-y:auto;
  }
  .edit-sheet h2{margin:0 0 16px;font-size:18px;font-weight:800;color:var(--navy);}
  .edit-sheet label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin:12px 0 6px;}
  .edit-sheet input{
    width:100%;font-family:'Heebo',sans-serif;font-size:15px;padding:11px 12px;
    border:1.5px solid var(--line);border-radius:9px;background:#FBFCFD;color:var(--text);
  }
  .edit-sheet input:focus{outline:none;border-color:var(--navy);background:#fff;}
  .edit-actions{display:flex;gap:10px;margin-top:20px;}
  .edit-actions button{
    flex:1;border:none;padding:14px;border-radius:10px;font-family:'Heebo',sans-serif;
    font-size:15px;font-weight:700;cursor:pointer;
  }
  #editSaveBtn{background:var(--navy);color:#fff;}
  #editCancelBtn{background:none;border:1.5px solid var(--line);color:var(--text-dim);}

  .danger-row{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .cancel-btn, .delete-btn{
    flex:1;border:1.5px solid var(--line);background:#fff;color:var(--text-dim);
    padding:8px;border-radius:9px;font-family:'Heebo',sans-serif;font-size:12.5px;
    font-weight:700;cursor:pointer;
  }
  .cancel-btn:hover{border-color:var(--amber);color:var(--amber);}
  .delete-btn:hover{border-color:#C0392B;color:#C0392B;}

  .call-id{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;color:#9AACB1;margin-top:8px;
  }
  .work-done{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
    font-size:13px;
  }
  .work-done b{color:var(--text-dim);font-weight:600;}

  .price-box{
    margin-top:10px;padding:10px 12px;background:var(--accent-soft);
    border-radius:9px;font-size:12.5px;color:var(--navy);line-height:1.7;
  }
  .price-box b{font-weight:700;}
  .price-margin{font-weight:700;color:var(--green);}

  .media-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .media-row a{
    font-size:12px;font-weight:700;color:var(--navy);text-decoration:none;
    background:#F5F8F9;border:1px solid var(--line);border-radius:20px;padding:5px 12px;
  }
  .media-row a:hover{border-color:var(--navy);}

  .assign-row{
    display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;
  }
  .assign-label{font-size:12px;color:var(--text-dim);font-weight:600;}
  .pill{
    font-size:12px;font-weight:700;
    padding:5px 12px;border-radius:20px;
    border:1.5px solid var(--line);background:#fff;color:var(--text-dim);
    cursor:pointer;
  }
  .pill.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .pill:hover{border-color:var(--accent);}
  .tech-pills{display:flex;flex-wrap:wrap;gap:8px;}
  .tech-pills .pill{padding:9px 15px;font-size:13.5px;}
  .priority-pills{display:flex;gap:8px;flex-wrap:wrap;}
  .priority-pill{border:1.5px solid var(--line);background:#fff;color:var(--text-dim);padding:9px 15px;border-radius:22px;font:700 13.5px 'Heebo',sans-serif;cursor:pointer;}
  .priority-pill[data-priority="רגיל"].active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .priority-pill[data-priority="דחוף"].active{background:var(--amber);border-color:var(--amber);color:#fff;}
  .priority-pill[data-priority="חירום"].active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .priority-badge{display:inline-block;margin:0 0 8px;padding:4px 9px;border-radius:18px;font-size:12px;font-weight:800;}
  .priority-badge.urgent{background:var(--amber-soft);color:#A65E00;}
  .priority-badge.emergency{background:var(--accent);color:#fff;}
  .call.priority-emergency{border-right:6px solid var(--accent);}
  .call.priority-urgent{border-right:6px solid var(--amber);}

  .empty, .loading{
    margin:30px 20px;text-align:center;color:var(--text-dim);
    font-size:14px;
  }
  .config{
    margin:20px;padding:16px;background:var(--amber-soft);
    border:1px solid #F0D9AE;border-radius:12px;font-size:13px;color:#7A5205;
    line-height:1.7;
  }
  .config code{background:#fff;padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:30px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .2s, bottom .2s;
  }
  .toast.show{opacity:1;pointer-events:none;bottom:30px;}

  /* --- Mic buttons & quick capture --- */
  .field-row{display:flex;gap:8px;align-items:stretch;}
  .field-row > *:first-child{flex:1;}
  .mic-btn{
    flex-shrink:0;width:46px;height:46px;border-radius:50%;
    background:#fff;border:1.5px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--navy);transition:all .15s;
  }
  .mic-btn svg{width:20px;height:20px;}
  .mic-btn:hover{border-color:var(--accent);}
  .mic-btn.listening{
    background:#FCE9E9;border-color:#E0574F;color:#E0574F;
    animation:pulse 1.1s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(224,87,79,.35);}
    70%{box-shadow:0 0 0 9px rgba(224,87,79,0);}
    100%{box-shadow:0 0 0 0 rgba(224,87,79,0);}
  }
  .quick-capture{
    background:var(--accent-soft);
    border:1.5px dashed #E9B3AB;
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:18px;
  }
  .quick-capture .qc-title{
    font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .quick-capture textarea{
    width:100%;min-height:70px;font-family:'Heebo',sans-serif;font-size:14.5px;
    padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;
    background:#fff;color:var(--text);resize:vertical;
  }
  .quick-capture textarea:focus{outline:none;border-color:var(--accent);}
  .qc-actions{display:flex;gap:8px;margin-top:10px;}
  .qc-btn{
    flex:1;border:none;border-radius:9px;padding:11px;
    font-family:'Heebo',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .qc-btn.mic{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  .qc-btn.mic.listening{background:#FCE9E9;color:#E0574F;border-color:#E0574F;animation:pulse 1.1s infinite;}
  .qc-btn.fill{background:var(--navy);color:#fff;}

  .contact-pick-btn{
    width:100%;background:#fff;border:1.5px dashed var(--navy);color:var(--navy);
    padding:12px;border-radius:10px;font-family:'Heebo',sans-serif;font-size:14px;
    font-weight:700;cursor:pointer;margin-bottom:6px;
  }
  .contact-pick-btn:hover{background:var(--accent-soft);}
  .qc-btn svg{width:16px;height:16px;}
  .no-speech-note{font-size:12px;color:var(--text-dim);margin-top:6px;}

  /* --- Monthly report --- */
  .report-box{
    background:var(--card);margin:0 20px;border-radius:14px;padding:18px;
    border:1px solid var(--line);
  }
  .report-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .report-controls input[type="month"]{flex:1;min-width:140px;}
  .report-controls button{
    background:var(--navy);color:#fff;border:none;padding:11px 18px;border-radius:9px;
    font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .report-controls button:hover{background:var(--navy-deep);}
  .report-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px;}
  .report-table th, .report-table td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);}
  .report-table th{color:var(--text-dim);font-weight:700;font-size:12px;}
  .report-table td.num{font-family:'JetBrains Mono',monospace;}
  .report-table tr.total-row td{font-weight:800;border-top:2px solid var(--navy);border-bottom:none;color:var(--navy);}
  .report-table td.profit-pos{color:var(--green);font-weight:700;}
  .report-table td.profit-neg{color:#C0392B;font-weight:700;}
  .report-export{display:flex;gap:10px;margin-top:16px;}
  .report-export button{
    flex:1;background:#fff;border:1.5px solid var(--line);color:var(--navy);
    padding:11px;border-radius:9px;font-family:'Heebo',sans-serif;font-size:13.5px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .report-export button:hover{border-color:var(--accent);color:var(--accent);}
  .report-empty{margin-top:14px;font-size:13px;color:var(--text-dim);text-align:center;}
  .collection-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 20px 14px;}
  .collection-stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .collection-stat span{display:block;color:var(--text-dim);font-size:12px;margin-bottom:4px;}
  .collection-stat b{font-size:20px;color:var(--navy);}
  .collection-tools{display:flex;gap:9px;margin:0 20px 14px;}
  .collection-tools input,.collection-tools select{flex:1;margin:0;}
  .collection-list{margin:0 20px;}
  .collection-card{background:var(--card);border:1px solid var(--line);border-right:5px solid var(--navy);border-radius:12px;padding:14px;margin-bottom:11px;}
  .collection-card.unpriced{border-right-color:var(--accent);background:var(--accent-soft);}
  .collection-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .collection-name{font-weight:800;color:var(--navy);font-size:17px;}
  .collection-amount{font-weight:800;color:var(--navy);font-size:18px;white-space:nowrap;}

<script>
// ============================================================
// הדבק כאן את כתובת ה-URL של Google Apps Script שלך אחרי הפריסה
const API_URL = "https://script.google.com/macros/s/AKfycbw0fAfYyK9gfViAaVFs0G1HPNguFjdAU4bDt6HCIs_LuOzKuu8lKIM0mLP48gIfeZ-Kwg/exec";
// ============================================================

const listEl = document.getElementById('list');
const configBox = document.getElementById('configBox');
const toast = document.getElementById('toast');
const assignedPills = document.getElementById('assignedPills');
const techChips = document.getElementById('techChips');
let assignedTechValue = '';
let priorityValue = 'רגיל';

document.querySelectorAll('#priorityPills .priority-pill').forEach(btn=>{
  btn.addEventListener('click',()=>{
    priorityValue = btn.dataset.priority;
    document.querySelectorAll('#priorityPills .priority-pill').forEach(b=>b.classList.toggle('active',b===btn));
  });
});
let workTypeVal = 'תיקון';
document.querySelectorAll('#workTypePills .pill').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    workTypeVal = btn.dataset.val;
    document.querySelectorAll('#workTypePills .pill').forEach(b=> b.classList.toggle('active', b === btn));
  });
});

let TECHNICIANS = [];

function showToast(msg, duration){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), duration || 2400);
}

function isConfigured(){ return API_URL && !API_URL.includes('PASTE_YOUR'); }

if(!isConfigured()){
  configBox.innerHTML = `<div class="config">⚠️ האפליקציה עדיין לא מחוברת לגיליון. יש להדביק את כתובת ה-Apps Script בשורה <code>API_URL</code> בקוד (בתחילת תגית ה-script).</div>`;
}

async function loadTechnicians(){
  if(!isConfigured()) return;
  // הצג מיד רשימה שמורה מהפעם הקודמת כדי שהכפתורים יופיעו באופן מיידי
  try{
    const cached = localStorage.getItem('cachedTechnicians');
    if(cached){
      TECHNICIANS = JSON.parse(cached);
      renderTechUI();
    }
  }catch(err){ /* ignore cache errors */ }
  try{
    const res = await fetch(API_URL + '?action=technicians', { cache: 'no-store' });
    TECHNICIANS = await res.json();
    localStorage.setItem('cachedTechnicians', JSON.stringify(TECHNICIANS));
  }catch(err){
    if(!TECHNICIANS.length) TECHNICIANS = [];
  }
  renderTechUI();
}

function renderTechUI(){
  // כפתורי בחירה במקום תפריט נפתח (select) - לא נפתח כמו שצריך בטלפון בתוך המסגרת של גוגל
  assignedTechValue = '';
  assignedPills.innerHTML = [`<button type="button" class="pill active" data-name="">לא משויך עדיין</button>`]
    .concat(TECHNICIANS.map(t => `<button type="button" class="pill" data-name="${escapeAttr(t)}">${escapeHtml(t)}</button>`))
    .join('');
  assignedPills.querySelectorAll('.pill').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      assignedTechValue = btn.dataset.name;
      assignedPills.querySelectorAll('.pill').forEach(b=> b.classList.toggle('active', b === btn));
    });
  });
  // chips list
  techChips.innerHTML = TECHNICIANS.length
    ? TECHNICIANS.map(t => `<span class="tech-chip">${escapeHtml(t)}</span>`).join('')
    : `<span style="font-size:12.5px;color:var(--text-dim);">עדיין אין טכנאים רשומים</span>`;
}

document.getElementById('addTechBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('newTechName').value.trim();
  const phone = document.getElementById('newTechPhone').value.trim();
  const pin = document.getElementById('newTechPin').value.trim();
  if(!name){ showToast('צריך למלא שם'); return; }
  if(!/^\d{4}$/.test(pin)){ showToast('קוד הכניסה חייב להיות בדיוק 4 ספרות'); return; }
  const btn = document.getElementById('addTechBtn');
  btn.disabled = true;
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'addTechnician', name, phone, pin })
    });
    const result = await res.json();
    if(result.success){
      document.getElementById('newTechName').value = '';
      document.getElementById('newTechPhone').value = '';
      document.getElementById('newTechPin').value = '';
      showToast(`${name} נוסף בהצלחה ✓`);
      await loadTechnicians();
    }else{
      showToast(result.error || 'שגיאה בהוספה');
    }
  }catch(err){
    showToast('שגיאה בהוספה, נסה שוב');
  }finally{
    btn.disabled = false;
  }
});

function statusClass(status){
  if(status === 'הושלם') return 'status-done';
  if(status === 'בוטל') return 'status-cancelled';
  if(status === 'ממתין להמשך טיפול') return 'status-followup';
  if(status === 'בטיפול') return 'status-progress';
  return 'status-new';
}

let allCalls = [];
let currentFilter = 'open';

async function loadCalls(){
  if(!isConfigured()) return;
  listEl.innerHTML = `<div class="loading">טוען קריאות...</div>`;
  try{
    const res = await fetch(API_URL, { cache: 'no-store' });
    const data = await res.json();
    allCalls = data.reverse();
    applyFilterAndRender();
  }catch(err){
    listEl.innerHTML = `<div class="empty">שגיאה בטעינת הנתונים. בדוק את החיבור לגיליון.</div>`;
  }
}

function applyFilterAndRender(){
  const filtered = (currentFilter === 'open'
    ? allCalls.filter(c => c['סטטוס'] !== 'הושלם' && c['סטטוס'] !== 'בוטל')
    : allCalls.filter(c => c['סטטוס'] === 'הושלם' || c['סטטוס'] === 'בוטל'))
    .sort((a,b)=>priorityRank(b['רמת דחיפות'])-priorityRank(a['רמת דחיפות']));
  renderList(filtered);
}

function priorityRank(priority){ return priority === 'חירום' ? 2 : (priority === 'דחוף' ? 1 : 0); }
function priorityInfo(priority){
  if(priority === 'חירום') return {card:'priority-emergency',badge:'<div class="priority-badge emergency">חירום — לטיפול ראשון</div>'};
  if(priority === 'דחוף') return {card:'priority-urgent',badge:'<div class="priority-badge urgent">דחוף</div>'};
  return {card:'',badge:''};
}

function getWaitLabel(openDateStr, status){
  if(status === 'הושלם') return '';
  const opened = new Date(openDateStr);
  if(isNaN(opened.getTime())) return '';
  const diffDays = Math.floor((Date.now() - opened.getTime()) / 86400000);
  if(diffDays <= 0) return 'נפתח היום';
  if(diffDays === 1) return 'ממתין כבר יום';
  return `ממתין כבר ${diffDays} ימים`;
}

function renderList(calls){
  if(!calls.length){
    const msg = currentFilter === 'open' ? 'אין קריאות פתוחות כרגע.' : 'אין עדיין קריאות סגורות.';
    listEl.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  listEl.innerHTML = calls.map(c => {
    const sc = statusClass(c['סטטוס']);
    const workDone = c['מה בוצע'] ? `<div class="work-done"><b>מה בוצע:</b> ${escapeHtml(c['מה בוצע'])}</div>` : '';
    const id = c['מזהה']||'';
    const assignedTech = normalizeName(c['טכנאי משויך']||'');
    const priority = priorityInfo(c['רמת דחיפות']);

    const waitLabel = getWaitLabel(c['תאריך פתיחה'], c['סטטוס']);
    const waitDaysNum = Math.floor((Date.now() - new Date(c['תאריך פתיחה']).getTime()) / 86400000);
    const waitClass = waitDaysNum >= 3 ? 'wait-urgent' : (waitDaysNum >= 1 ? 'wait-soon' : 'wait-new');

    const techPrice = c['מחיר טכנאי'];
    const customerPrice = c['מחיר ללקוח'];
    let priceBox = '';
    if(techPrice || customerPrice){
      const vatTxt = c['כולל מעמ טכנאי'] === 'כן' ? 'כולל מע"מ' : 'לא כולל מע"מ';
      const margin = (techPrice && customerPrice && !isNaN(techPrice) && !isNaN(customerPrice))
        ? `<div class="price-margin">רווח: ${Number(customerPrice) - Number(techPrice)} ₪</div>` : '';
      const paidStatus = c['שולם בפועל'] === 'כן';
      const amountReceived = c['סכום שהתקבל'];
      let paidRow = `<div><b>שולם בפועל:</b> ${paidStatus ? `כן ✓ (${escapeHtml(amountReceived||'-')} ₪)` : 'עדיין לא'}</div>`;
      if(paidStatus && amountReceived && techPrice && !isNaN(amountReceived) && !isNaN(techPrice)){
        const diff = Number(amountReceived) - Number(techPrice);
        if(diff > 0) paidRow += `<div class="price-margin">יתרה לזכות העסק: ${diff} ₪</div>`;
        else if(diff < 0) paidRow += `<div style="color:#C0392B;font-weight:700;">חסר להשלים לטכנאי: ${-diff} ₪</div>`;
      }
      priceBox = `
        <div class="price-box">
          <div><b>מחיר טכנאי:</b> ${escapeHtml(techPrice||'-')} ₪ (${vatTxt})</div>
          <div><b>מחיר ללקוח:</b> ${escapeHtml(customerPrice||'-')} ₪</div>
          <div><b>נאמר ללקוח:</b> ${c['נאמר ללקוח'] === 'כן' ? 'כן ✓' : 'לא'}</div>
          ${paidRow}
          ${margin}
        </div>`;
    }

    const assignPills = TECHNICIANS.map(t => `

        <div class="danger-row">
          ${c['סטטוס'] !== 'הושלם' && c['סטטוס'] !== 'בוטל' ? `<button type="button" class="cancel-btn" data-id="${escapeAttr(id)}">🚫 בטל קריאה</button>` : ''}

        </div>
        <div class="call-id">מזהה: ${escapeHtml(id)}</div>

  }).join('');

  listEl.querySelectorAll('.pill').forEach(btn=>{
    btn.addEventListener('click', ()=> reassign(btn.dataset.id, btn.dataset.tech));

  listEl.querySelectorAll('.cancel-btn').forEach(btn=>{

async function repairCallIntegrations(btn){
  if(!isConfigured() || btn.disabled) return;
  if(!confirm('להשלים מסמך ולשלוח SMS לטכנאי עבור הקריאה הקיימת?')) return;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'מטפל...';
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'repairCallIntegrations', id:btn.dataset.id})
    });
    const result = await res.json();
    if(!result.success) throw new Error(result.error || 'הפעולה נכשלה');
    if(result.smsSuccess){
      showToast(`✓ מסמך ${result.docNumber} מוכן וה-SMS טופל`, 8000);
    }else{
      showToast(`✓ מסמך ${result.docNumber} מוכן. ה-SMS נכשל: ${result.smsError}`, 10000);
    }
    btn.textContent = '✓ המסמך וההודעה טופלו';
  }catch(err){
    showToast(`⚠️ ${err.message || err}`, 10000);
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

async function reassign(id, tech){
  if(!isConfigured()) return;
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'update', id, assignedTechnician: tech })
    });
    const result = await res.json();
    showToast(`הקריאה הועברה ל${tech} ✓`);
    loadCalls();

    // שליחת ה-SMS רצה ברקע בלי לעכב את המשתמש - מעדכנים בטוסט נפרד כשמסתיים
    if(result.needsSms){
      fetch(API_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'sendAssignmentSms', ...result.needsSms })
      }).then(r=>r.json()).then(sms=>{
        if(sms.success){
          showToast(`✓ נשלח SMS ל${tech}`);
        }else{
          showToast(`⚠️ שליחת ה-SMS ל${tech} נכשלה: ${sms.error || ''}`, 6000);
        }
      }).catch(()=>{});
    }
  }catch(err){
    showToast('שגיאה בהעברה, נסה שוב');
  }
}

        mimeType: file.type || 'image/jpeg',

function normalizeName(str){
  return String(str||'')
    .replace(/[\u200B\u200C\u200D\u200E\u200F\u202A-\u202E\uFEFF]/g,'')
    .trim();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;'); }

  };

      body: JSON.stringify(payload)
    });
    const result = await res.json();

    callSaved = true;
    btn.textContent = 'יוצר מסמך...';

    const docRes = await fetch(API_URL, {

      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action: 'createCustomerDoc',
        customerName: payload.customerName,
        phone: payload.phone,
        address: payload.address,
        workType: payload.workType,
        projectName: payload.projectName,
        orderedBy: payload.orderedBy,
        orderedByPhone: payload.orderedByPhone
      })
    });
    const doc = await docRes.json();
    if(!doc.success){
      throw new Error('הקריאה נשמרה, אך המסמך לא נוצר: ' + (doc.error || 'שגיאה לא ידועה'));
    }

    let sms = {success:true, skipped:true};
    if(!result.skippedCall && payload.assignedTechnician){
      btn.textContent = 'שולח SMS...';
      try{
        const smsRes = await fetch(API_URL, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({
          action:'sendAssignmentSms',
          technicianName: payload.assignedTechnician,
          customerName: payload.customerName,
          address: payload.address,
            issueType: payload.issueType
          })
        });
        sms = await smsRes.json();
      }catch(smsErr){
        sms = {success:false, error:'אין תגובה משירות ה-SMS'};
      }
    }

    document.getElementById('callForm').reset();
    workTypeVal = 'תיקון';
    document.querySelectorAll('#workTypePills .pill').forEach(b=> b.classList.toggle('active', b.dataset.val === workTypeVal));
    renderTechUI();
    priorityValue = 'רגיל';
    document.querySelectorAll('#priorityPills .priority-pill').forEach(b=>b.classList.toggle('active',b.dataset.priority==='רגיל'));
    completed = true;

    const baseMessage = `✓ נשמר. מספר מסמך: ${doc.docNumber}`;
    if(!sms.success){
      showToast(`${baseMessage}. ה-SMS לא נשלח: ${sms.error || 'שגיאה לא ידועה'}`, 9000);
    }else if(result.skippedCall || sms.skipped){
      showToast(`${baseMessage} (לא נדרש SMS)`, 7000);
    }else{
      showToast(`${baseMessage}. נשלח SMS ל${payload.assignedTechnician}`, 7000);
    }
  }catch(err){
    if(callSaved){
      showToast(`⚠️ ${err.message || err}. אין ללחוץ שוב — הקריאה כבר נשמרה.`, 12000);
    }else{
      showToast(`שגיאה בשליחה: ${err.message || err}`, 8000);
    }
  }finally{
    btn.disabled = callSaved && !completed;
    btn.textContent = callSaved && !completed ? 'הקריאה נשמרה — לא לשלוח שוב' : 'שלח קריאה לטכנאי';
  }
});

function startRecognition(onResult, onEnd){
  const rec = new SpeechRecognitionClass();
  rec.lang = 'he-IL';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.continuous = false;
  rec.onresult = (e) => {
    const text = e.results[0][0].transcript;
    onResult(text);
  };
  rec.onerror = () => { showToast('לא הצלחתי לשמוע, נסה שוב'); };
  rec.onend = () => { if(onEnd) onEnd(); };
  rec.start();
  return rec;
}

    const targetId = btn.dataset.target;
    const el = document.getElementById(targetId);
    btn.classList.add('listening');
    startRecognition(
      (text) => {
        el.value = el.value ? (el.value + ' ' + text) : text;
        el.focus();
      },
      () => btn.classList.remove('listening')
    );
  });
});

    calls = await res.json();
  }catch(err){
    reportContent.innerHTML = `<div class="report-empty">שגיאה בטעינת הנתונים.</div>`;
    return;
  }

  const monthCalls = calls.filter(c=>{
    const d = new Date(c['תאריך פתיחה']);
    if(isNaN(d.getTime())) return false;
    return d.getFullYear() === year && (d.getMonth()+1) === month;
  });

  lastReportCalls = monthCalls;
  lastReportMonthLabel = `${monthStr}-${yearStr}`;

  if(!monthCalls.length){
    reportContent.innerHTML = `<div class="report-empty">אין קריאות בחודש שנבחר.</div>`;
    reportExportRow.style.display = 'none';
    return;
  }

  // קיבוץ לפי טכנאי
  const byTech = {};
  monthCalls.forEach(c=>{
    const tech = c['טכנאי משויך'] || 'לא משויך';
    if(!byTech[tech]) byTech[tech] = { count:0, techSum:0, custSum:0 };
    byTech[tech].count += 1;
    byTech[tech].techSum += toNum(c['מחיר טכנאי']);
    byTech[tech].custSum += toNum(c['מחיר ללקוח']);
  });

  let totalCount=0, totalTech=0, totalCust=0;
  const rowsHtml = Object.keys(byTech).sort().map(tech=>{
    const r = byTech[tech];
    const profit = r.custSum - r.techSum;
    totalCount += r.count; totalTech += r.techSum; totalCust += r.custSum;
    return `
      <tr>
        <td>${escapeHtml(tech)}</td>
        <td class="num">${r.count}</td>
        <td class="num">${r.techSum.toLocaleString()} ₪</td>
        <td class="num">${r.custSum.toLocaleString()} ₪</td>
        <td class="num ${profit>=0?'profit-pos':'profit-neg'}">${profit.toLocaleString()} ₪</td>
      </tr>`;
  }).join('');

  const totalProfit = totalCust - totalTech;

  reportContent.innerHTML = `
    <table class="report-table">
      <thead>
        <tr><th>טכנאי</th><th>קריאות</th><th>שולם לטכנאי</th><th>נגבה מהלקוח</th><th>רווח</th></tr>
      </thead>
      <tbody>
        ${rowsHtml}
        <tr class="total-row">
          <td>סה"כ</td>
          <td class="num">${totalCount}</td>
          <td class="num">${totalTech.toLocaleString()} ₪</td>
          <td class="num">${totalCust.toLocaleString()} ₪</td>
          <td class="num ${totalProfit>=0?'profit-pos':'profit-neg'}">${totalProfit.toLocaleString()} ₪</td>
        </tr>
      </tbody>
    </table>`;
  reportExportRow.style.display = 'flex';
});

function buildDetailRows(){
  return lastReportCalls
    .slice()
    .sort((a,b)=> new Date(a['תאריך פתיחה']) - new Date(b['תאריך פתיחה']))
    .map(c=>{
      const tech = toNum(c['מחיר טכנאי']);
      const cust = toNum(c['מחיר ללקוח']);
      return {
        'תאריך': formatDate(c['תאריך פתיחה']),
        'שם לקוח': c['שם לקוח']||'',
        'כתובת': c['כתובת']||'',
        'סוג תקלה': c['סוג תקלה']||'',
        'טכנאי': c['טכנאי משויך']||'לא משויך',
        'מחיר טכנאי': tech,
        'מחיר ללקוח': cust,
        'רווח': cust - tech,
        'סטטוס': c['סטטוס']||'',
        'פירוט חיוב': c['פירוט חיוב']||''
      };
    });
}

document.getElementById('exportExcelBtn').addEventListener('click', ()=>{
  if(!lastReportCalls.length){ showToast('אין נתונים לייצוא'); return; }
  const rows = buildDetailRows();
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:11},{wch:18},{wch:22},{wch:20},{wch:14},{wch:12},{wch:12},{wch:10},{wch:12},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'דוח חודשי');
  XLSX.writeFile(wb, `דוח_קריאות_${lastReportMonthLabel}.xlsx`);
});

document.getElementById('exportPdfBtn').addEventListener('click', ()=>{
  if(!lastReportCalls.length){ showToast('אין נתונים לייצוא'); return; }
  const rows = buildDetailRows();
  const tableRows = rows.map(r => `
    <tr>
      <td>${escapeHtml(r['תאריך'])}</td>
      <td>${escapeHtml(r['שם לקוח'])}</td>
      <td>${escapeHtml(r['כתובת'])}</td>
      <td>${escapeHtml(r['סוג תקלה'])}</td>
      <td>${escapeHtml(r['טכנאי'])}</td>
      <td>${r['מחיר טכנאי']} ₪</td>
      <td>${r['מחיר ללקוח']} ₪</td>
      <td>${r['רווח']} ₪</td>
      <td>${escapeHtml(r['סטטוס'])}</td>
    </tr>`).join('');

  const totalTech = rows.reduce((s,r)=>s+r['מחיר טכנאי'],0);
  const totalCust = rows.reduce((s,r)=>s+r['מחיר ללקוח'],0);
  const totalProfit = totalCust - totalTech;

  const printHtml = `
    <!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8">
    <title>דוח קריאות ${lastReportMonthLabel}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:24px;color:#152026;}
      h1{font-size:18px;margin-bottom:4px;}
      p.sub{color:#5C6E75;font-size:13px;margin-top:0;}
      table{width:100%;border-collapse:collapse;font-size:12px;margin-top:16px;}
      th,td{border:1px solid #ccc;padding:6px 8px;text-align:right;}
      th{background:#153E6F;color:#fff;}
      tr:nth-child(even){background:#F5F8F9;}
      tfoot td{font-weight:700;background:#E4F5F2;}
      @media print{ body{padding:0;} }
    </style></head>
    <body>
      <h1>דוח קריאות שירות - ${lastReportMonthLabel}</h1>
      <p class="sub">${rows.length} קריאות בחודש</p>
      <table>
        <thead><tr>
          <th>תאריך</th><th>שם לקוח</th><th>כתובת</th><th>תקלה</th><th>טכנאי</th>
          <th>מחיר טכנאי</th><th>מחיר ללקוח</th><th>רווח</th><th>סטטוס</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
        <tfoot><tr>
          <td colspan="5">סה"כ</td>
          <td>${totalTech} ₪</td><td>${totalCust} ₪</td><td>${totalProfit} ₪</td><td></td>
        </tr></tfoot>
      </table>
    </body></html>`;

  const win = window.open('', '_blank');
  win.document.write(printHtml);
  win.document.close();

// מעקב גבייה - פתיחת הודעה ידנית ותיעוד לאחר השליחה
let COLLECTIONS = [];
const COLLECTION_PENDING_CHANNEL = {};
let COLLECTION_OWNER_TOKEN = sessionStorage.getItem('collectionOwnerToken') || '';

function money(value){
  return new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(Number(value)||0);
}

function collectionMessage(c){
  if(!c.amountIsFinal){
    return `שלום ${c.name}, תזכורת מא.מ.ן מיזוג אוויר: קיימת יתרה פתוחה בחשבונך. הסכום עדיין בבדיקה עקב עבודות שטרם תומחרו. נשמח להסדיר ולעדכן את החשבון. תודה.`;
  }
  return `שלום ${c.name}, תזכורת מא.מ.ן מיזוג אוויר: קיימת יתרה לתשלום בסך ${money(c.amount)}. נשמח להסדרת התשלום. תודה.`;
}

async function loadCollections(){
  if(!COLLECTION_OWNER_TOKEN){
    document.getElementById('collectionLoginBox').style.display = 'flex';
    document.getElementById('collectionProtected').style.display = 'none';
    return;
  }
  const list = document.getElementById('collectionList');
  list.innerHTML = `<div class="loading">טוען נתוני גבייה...</div>`;
  try{
    const res = await fetch(API_URL + '?action=collections&ownerToken=' + encodeURIComponent(COLLECTION_OWNER_TOKEN), {cache:'no-store'});
    const result = await res.json();
    if(!result.success){
      if(result.error && result.error.includes('כניסת')){
        COLLECTION_OWNER_TOKEN=''; sessionStorage.removeItem('collectionOwnerToken');
        document.getElementById('collectionLoginBox').style.display='flex';
        document.getElementById('collectionProtected').style.display='none';
      }
      throw new Error(result.error || 'שגיאה');
    }
    document.getElementById('collectionLoginBox').style.display = 'none';
    document.getElementById('collectionProtected').style.display = 'block';
    COLLECTIONS = result.customers || [];
    renderCollectionSummary(result.summary || {});
    renderCollections();
  }catch(err){
    list.innerHTML = `<div class="empty">לא ניתן לטעון את דוח הגבייה.</div>`;
  }
}

function renderCollectionSummary(s){
  document.getElementById('collectionSummary').innerHTML = `
    <div class="collection-stat"><span>לקוחות במעקב</span><b>${Number(s.count)||0}</b></div>
    <div class="collection-stat"><span>יתרה סופית מוכנה לגבייה</span><b>${money(s.totalFinal)}</b></div>
    <div class="collection-stat"><span>דורשים תמחור</span><b>${Number(s.needsPricing)||0}</b></div>`;
}

function filteredCollections(){
  const q = normalizeName(document.getElementById('collectionSearch').value).toLowerCase();
  const filter = document.getElementById('collectionFilter').value;
  return COLLECTIONS.filter(c => {
    if(q && !normalizeName(c.name).toLowerCase().includes(q)) return false;
    if(filter === 'ready' && !c.amountIsFinal) return false;
    if(filter === 'unpriced' && c.amountIsFinal) return false;
    if(filter === 'missing' && c.phone1 && c.email) return false;
    return true;
  });
}

function renderCollections(){
  const list = document.getElementById('collectionList');
  const rows = filteredCollections();
  if(!rows.length){ list.innerHTML = `<div class="empty">לא נמצאו לקוחות מתאימים.</div>`; return; }
  list.innerHTML = rows.map(c => {
    const key = COLLECTIONS.indexOf(c);
    const warning = c.amountIsFinal ? '' : `<div class="collection-warning">${c.unpricedCount} עבודות לפני תמחור — הסכום אינו סופי</div>`;
    const last = c.lastReminderDate ? `${escapeHtml(c.lastReminderDate)} · ${escapeHtml(c.lastReminderChannel||'')}` : 'לא תועדה תזכורת';
    const phones = Array.isArray(c.phoneOptions) ? c.phoneOptions.filter(Boolean) : [c.phone1,c.phone2].filter(Boolean);
    const phoneField = phones.length > 1
      ? `<select id="collectionPhone-${key}">${phones.map((p,i)=>`<option value="${escapeAttr(p)}">${escapeHtml(p)}${i===0?' — ראשי':''}</option>`).join('')}</select>`
      : `<input id="collectionPhone-${key}" value="${escapeAttr(phones[0]||'')}" placeholder="טלפון / WhatsApp">`;
    return `<div class="collection-card ${c.amountIsFinal?'':'unpriced'}">
      <div class="collection-head"><div><div class="collection-name">${escapeHtml(c.name)}</div>${warning}</div><div class="collection-amount">${money(c.amount)}</div></div>
      <div class="collection-meta">מסמך אחרון: ${escapeHtml(c.lastDocumentNumber||'-')} · ${escapeHtml(c.lastDocumentDate||'-')}<br>תזכורת אחרונה: ${last}</div>
      <div class="collection-contact">
        ${phoneField}
        <input id="collectionEmail-${key}" value="${escapeAttr(c.email||'')}" placeholder="דואר אלקטרוני">
        <button class="btn-save" onclick="saveCollectionContact(${key})">שמור פרטים</button>
      </div>
      <div class="collection-actions">
        <button class="btn-whatsapp" onclick="openCollectionWhatsApp(${key})">פתח WhatsApp</button>
        <button class="btn-email" onclick="openCollectionEmail(${key})">פתח מייל</button>
        <button class="btn-phone" onclick="openCollectionPhone(${key})">התקשר</button>
        <button class="btn-log" onclick="logCollectionReminder(${key},COLLECTION_PENDING_CHANNEL[${key}]||'שיחה/אחר')">תעד שנשלח</button>
      </div>
    </div>`;
  }).join('');
}

async function saveCollectionContact(index){
  const c = COLLECTIONS[index];
  const phone1 = document.getElementById(`collectionPhone-${index}`).value.trim();
  const email = document.getElementById(`collectionEmail-${index}`).value.trim();
  const result = await postCollectionAction({action:'updateCollectionContact',customerName:c.name,phone1,email});
  if(result.success){ c.phone1=phone1; c.email=email; showToast('פרטי הקשר נשמרו ✓'); }
  else showToast(result.error || 'שמירת הפרטים נכשלה');
}

function openCollectionWhatsApp(index){
  const c = COLLECTIONS[index];
  const phone = document.getElementById(`collectionPhone-${index}`).value.replace(/\D/g,'');
  if(!phone){ showToast('חסר מספר טלפון'); return; }
  const international = phone.startsWith('0') ? '972'+phone.slice(1) : phone;
  COLLECTION_PENDING_CHANNEL[index] = 'WhatsApp';
  window.open(`https://wa.me/${international}?text=${encodeURIComponent(collectionMessage(c))}`,'_blank');
  showToast('לאחר השליחה לחץ „תעד שנשלח”');
}

function openCollectionEmail(index){
  const c = COLLECTIONS[index];
  const email = document.getElementById(`collectionEmail-${index}`).value.trim();
  if(!email){ showToast('חסר דואר אלקטרוני'); return; }
  COLLECTION_PENDING_CHANNEL[index] = 'מייל';
  window.location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent('תזכורת תשלום - א.מ.ן מיזוג אוויר')}&body=${encodeURIComponent(collectionMessage(c))}`;
  showToast('לאחר השליחה לחץ „תעד שנשלח”');
}

function openCollectionPhone(index){
  const phone = document.getElementById(`collectionPhone-${index}`).value.trim();
  if(!phone){ showToast('חסר מספר טלפון'); return; }
  COLLECTION_PENDING_CHANNEL[index] = 'שיחה';
  window.location.href = `tel:${phone}`;
}

async function logCollectionReminder(index, channel){
  const c = COLLECTIONS[index];
  const phone = document.getElementById(`collectionPhone-${index}`).value.trim();
  const email = document.getElementById(`collectionEmail-${index}`).value.trim();
  const result = await postCollectionAction({action:'logCollectionReminder',customerName:c.name,channel,amount:c.amount,amountIsFinal:c.amountIsFinal,phone,email});
  if(result.success){ c.lastReminderDate=result.date; c.lastReminderChannel=channel; showToast('התזכורת תועדה ✓'); }
  else showToast(result.error || 'התיעוד נכשל');
}

async function postCollectionAction(payload){
  try{
    payload.ownerToken = COLLECTION_OWNER_TOKEN;
    const res = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    return await res.json();
  }catch(err){ return {success:false,error:'שגיאת חיבור'}; }
}

async function loginCollections(){
  const pin = document.getElementById('collectionOwnerPin').value.trim();
  if(!pin){ showToast('יש להזין קוד כניסה'); return; }
  const result = await postCollectionAction({action:'collectionLogin',pin});
  if(!result.success){ showToast(result.error || 'הכניסה נכשלה'); return; }
  COLLECTION_OWNER_TOKEN = result.token;
  sessionStorage.setItem('collectionOwnerToken',result.token);
  document.getElementById('collectionOwnerPin').value='';
  loadCollections();
}

document.getElementById('collectionRefreshBtn').addEventListener('click',loadCollections);
document.getElementById('collectionLoginBtn').addEventListener('click',loginCollections);
document.getElementById('collectionOwnerPin').addEventListener('keydown',e=>{if(e.key==='Enter') loginCollections();});
document.getElementById('collectionSearch').addEventListener('input',renderCollections);
document.getElementById('collectionFilter').addEventListener('change',renderCollections);
// דוח הגבייה כבד ולכן אינו נטען ברקע במסך הבית.

// ניווט בין מסכי הניהול. אפשר גם לפתוח ישירות, לדוגמה: owner.html?view=collection
const OWNER_VIEWS = {
  home: 'מערכת ניהול',
  'new-call': 'פתיחת עבודה חדשה',
  calls: 'עבודות קיימות',
  collection: 'מעקב גבייה',
  reports: 'דוחות',
  technicians: 'ניהול טכנאים'
};
const OWNER_VIEW_LOADED = {};

function loadOwnerViewData(viewName){
  if(viewName === 'new-call' && !OWNER_VIEW_LOADED.technicians){ loadTechnicians(); OWNER_VIEW_LOADED.technicians=true; }
  if(viewName === 'calls' && !OWNER_VIEW_LOADED.calls){ loadCalls(); OWNER_VIEW_LOADED.calls=true; }
  if(viewName === 'collection' && !OWNER_VIEW_LOADED.collection){ loadCollections(); OWNER_VIEW_LOADED.collection=true; }
  if(viewName === 'technicians' && !OWNER_VIEW_LOADED.technicians){ loadTechnicians(); OWNER_VIEW_LOADED.technicians=true; }
}

function openOwnerView(viewName, updateUrl=true){
  const safeView = OWNER_VIEWS[viewName] ? viewName : 'home';
  document.querySelectorAll('.app-view').forEach(view=>view.classList.remove('active'));
  const selected = document.getElementById(`view-${safeView}`);
  if(selected) selected.classList.add('active');
  document.getElementById('headerSubtitle').textContent = OWNER_VIEWS[safeView];
  document.getElementById('headerHomeBtn').style.display = safeView === 'home' ? 'none' : 'inline-block';
  loadOwnerViewData(safeView);

  if(updateUrl){
    const url = new URL(window.location.href);
    if(safeView === 'home') url.searchParams.delete('view');
    else url.searchParams.set('view',safeView);
    history.pushState({ownerView:safeView},'',url);
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

document.querySelectorAll('[data-open-view]').forEach(button=>{
  button.addEventListener('click',()=>openOwnerView(button.dataset.openView));
});
document.getElementById('headerHomeBtn').addEventListener('click',()=>openOwnerView('home'));
window.addEventListener('popstate',()=>{
  const view = new URLSearchParams(window.location.search).get('view') || 'home';
  openOwnerView(view,false);
});
openOwnerView(new URLSearchParams(window.location.search).get('view') || 'home',false);

// רישום ה-Service Worker - נדרש כדי שהדפדפן יאפשר "הוספה למסך הבית" כאפליקציה אמיתית
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
