<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153E6F">
<link rel="manifest" href="manifest-attendance.json">
<title>א.מ.ן — נוכחות מתקינים</title>
<style>
:root{--navy:#153E6F;--deep:#0B2A50;--red:#B7352A;--green:#178A4C;--bg:#F5F8F9;--line:#DDE6EA;--muted:#60737C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#142229;min-height:100dvh}header{background:linear-gradient(135deg,var(--navy),var(--deep));color:#fff;padding:26px 20px}header h1{font-size:22px;margin:0}header p{margin:6px 0 0;color:#c5d6e5}.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 4px 16px #0b2a5012;margin-bottom:14px}.hidden{display:none!important}label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:12px 0 6px}input,textarea{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;font-size:16px}textarea{min-height:110px}.btn{width:100%;border:0;border-radius:13px;padding:16px;margin-top:12px;font-size:17px;font-weight:800;color:#fff;background:var(--navy)}.btn.out{background:var(--red)}.btn.still{background:#D9820B}.btn:disabled{opacity:.55}.status{text-align:center;padding:12px;border-radius:12px;background:#edf3f7;color:var(--navy);font-weight:700;margin-bottom:14px}.status.in{background:#e7f6ed;color:var(--green)}.who{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.link{border:0;background:none;color:var(--red);font-weight:700}.note{font-size:13px;color:var(--muted);line-height:1.5}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#102c4d;color:#fff;padding:12px 18px;border-radius:24px;opacity:0;transition:.2s}.toast.show{opacity:1}
</style>
</head><body>
<header><h1>א.מ.ן מיזוג אוויר</h1><p>כניסה ויציאה — מתקינים</p></header>
<div class="wrap">
 <section class="card" id="loginBox"><h2>כניסה ראשונה</h2><p class="note">הזן את הקוד האישי. הטלפון יזכור אותך לפעמים הבאות.</p><label>קוד אישי</label><input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn" id="loginBtn">כניסה</button></section>
 <section id="appBox" class="hidden">
  <div class="card"><div class="who"><b id="employeeName"></b><button class="link" id="logoutBtn">התנתקות</button></div><div class="status" id="status">בודק מצב...</div><button class="btn" id="inBtn">כניסה לעבודה</button><button class="btn still hidden" id="stillBtn">אני עדיין בעבודה</button></div>
  <div class="card hidden" id="outBox"><h2>סיום עבודה</h2><label>מה בוצע היום? (חובה)</label><textarea id="summary" placeholder="אפשר לכתוב או להשתמש במיקרופון של המקלדת"></textarea><label>שעת יציאה</label><input id="outTime" type="time"><button class="btn out" id="outBtn">סיום ושמירת יציאה</button><p class="note">השעה ניתנת לתיקון אם שכחת לדווח בזמן.</p></div>
 </section>
</div><div class="toast" id="toast"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbw0fAfYyK9gfViAaVFs0G1HPNguFjdAU4bDt6HCIs_LuOzKuu8lKIM0mLP48gIfeZ-Kwg/exec';
const queryToken=new URLSearchParams(location.search).get('token')||'';
let token=queryToken||localStorage.getItem('installerToken')||'', name=localStorage.getItem('installerName')||'',cachedLocation=null;
const $=id=>document.getElementById(id);function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2800)}
async function post(payload){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});return r.json()}
function locationNow(){if(cachedLocation&&Date.now()-cachedLocation.savedAt<30000&&cachedLocation.accuracy<=250)return Promise.resolve(cachedLocation);return new Promise((resolve,reject)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{cachedLocation={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:Math.round(p.coords.accuracy),savedAt:Date.now()};if(cachedLocation.accuracy>1500)return reject(new Error('המיקום אינו מדויק. יש להפעיל מיקום מדויק בטלפון ולנסות שוב'));resolve(cachedLocation)},()=>reject(new Error('יש לאשר לדפדפן גישה למיקום מדויק')),{enableHighAccuracy:true,timeout:15000,maximumAge:0}):reject(new Error('אין תמיכה במיקום')))}
function paintState(inside,inTime=''){ $('status').textContent=inside?`בעבודה מאז ${inTime}`:'לא רשומה כניסה להיום';$('status').classList.toggle('in',inside);$('inBtn').classList.toggle('hidden',inside);$('outBox').classList.toggle('hidden',!inside);$('stillBtn').classList.toggle('hidden',!inside||!new URLSearchParams(location.search).has('reminder'));localStorage.setItem('attendanceLastState',JSON.stringify({inside,inTime,date:new Date().toDateString()})) }
function enter(){ $('loginBox').classList.add('hidden');$('appBox').classList.remove('hidden');$('employeeName').textContent=name;try{const c=JSON.parse(localStorage.getItem('attendanceLastState'));if(c&&c.date===new Date().toDateString())paintState(c.inside,c.inTime)}catch(e){}locationNow().catch(()=>{});loadStatus() }
async function loadStatus(){try{const r=await post({action:'attendanceStatus',token});if(!r.success)throw Error(r.error);if(r.name){name=r.name;localStorage.setItem('installerToken',token);localStorage.setItem('installerName',name);$('employeeName').textContent=name}paintState(!!r.clockedIn,r.inTime||'');if(!r.clockedIn)$('summary').value=''}catch(e){toast('אין חיבור כרגע — נסה שוב')}}
$('loginBtn').onclick=async()=>{const r=await post({action:'attendanceLogin',pin:$('pin').value.trim()});if(!r.success)return toast(r.error||'קוד שגוי');token=r.token;name=r.name;localStorage.setItem('installerToken',token);localStorage.setItem('installerName',name);enter()};
$('inBtn').onclick=async()=>{try{$('inBtn').disabled=true;$('inBtn').textContent='שומר כניסה...';const loc=await locationNow();const r=await post({action:'attendanceClockIn',token,location:loc});if(!r.success)throw Error(r.error);const t=new Date().toTimeString().slice(0,5);paintState(true,t);toast('הכניסה נשמרה ✓')}catch(e){toast(e.message)}finally{$('inBtn').disabled=false;$('inBtn').textContent='כניסה לעבודה'}};
$('outBtn').onclick=async()=>{const summary=$('summary').value.trim();if(!summary)return toast('חובה לפרט מה בוצע');try{$('outBtn').disabled=true;$('outBtn').textContent='שומר יציאה...';const loc=await locationNow();const r=await post({action:'attendanceClockOut',token,summary,outTime:$('outTime').value,location:loc});if(!r.success)throw Error(r.error);paintState(false,'');toast('היציאה נשמרה ✓');history.replaceState({},'',location.pathname)}catch(e){toast(e.message)}finally{$('outBtn').disabled=false;$('outBtn').textContent='סיום ושמירת יציאה'}};
$('stillBtn').onclick=async()=>{const r=await post({action:'attendanceStillWorking',token});if(r.success){toast('נרשם שאתה עדיין בעבודה');$('stillBtn').classList.add('hidden')}else toast(r.error||'שגיאה')};
$('logoutBtn').onclick=()=>{localStorage.removeItem('installerToken');localStorage.removeItem('installerName');location.reload()};
$('outTime').value=new Date().toTimeString().slice(0,5);if(token)enter();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<!-- AMN_LIVE_STATUS_V1: משוב חי ואופטימיזציית בקשות -->
<style>
  #amnLiveStatus{
    position:fixed;z-index:99999;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
    transform:translate(-50%,18px);min-width:190px;max-width:calc(100vw - 28px);
    padding:11px 18px;border-radius:999px;background:#153E6F;color:#fff;
    box-shadow:0 8px 28px rgba(11,42,80,.24);font-family:'Heebo',Arial,sans-serif;
    font-size:14px;font-weight:700;text-align:center;opacity:0;pointer-events:none;
    transition:opacity .18s ease,transform .18s ease
  }
  #amnLiveStatus.show{opacity:1;transform:translate(-50%,0)}
  #amnLiveStatus.success{background:#178A4C}
  #amnLiveStatus.error{background:#B7352A}
  #amnLiveStatus .amn-spinner{
    display:inline-block;width:14px;height:14px;margin-left:8px;vertical-align:-2px;
    border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;
    animation:amnSpin .7s linear infinite
  }
  @keyframes amnSpin{to{transform:rotate(360deg)}}
  button.amn-busy,[role="button"].amn-busy{opacity:.72;cursor:wait!important}
</style>
<script>
(function(){
  if(window.__amnLiveStatusInstalled) return;
  window.__amnLiveStatusInstalled=true;

  const status=document.createElement('div');
  status.id='amnLiveStatus';
  status.setAttribute('role','status');
  status.setAttribute('aria-live','polite');
  document.body.appendChild(status);

  let hideTimer=0;
  let activeRequests=0;
  const inFlightReads=new Map();
  const nativeFetch=window.fetch.bind(window);

  const actionLabels={
    uploadFile:['מעלה קובץ…','הקובץ הועלה ✓'],
    uploadOwnerPhoto:['מעלה קובץ…','הקובץ הועלה ✓'],
    recordPayment:['שומר תשלום…','התשלום נשמר ✓'],
    notifyCustomerOnWay:['שולח הודעה…','ההודעה נשלחה ✓'],
    updateStatus:['מעדכן סטטוס…','הסטטוס עודכן ✓'],
    saveCall:['שומר קריאה…','הקריאה נשמרה ✓'],
    createCall:['פותח קריאה…','הקריאה נפתחה ✓'],
    checkIn:['שומר כניסה…','הכניסה נשמרה ✓'],
    checkOut:['שומר יציאה…','היציאה נשמרה ✓'],
    saveAttendance:['שומר דיווח…','הדיווח נשמר ✓'],
    saveWork:['שומר עבודה…','העבודה נשמרה ✓'],
    saveTask:['שומר משימה…','המשימה נשמרה ✓'],
    completeTask:['מסמן כהושלם…','המשימה הושלמה ✓']
  };

  function show(message,type,keep){
    clearTimeout(hideTimer);
    status.className='show '+(type||'');
    status.innerHTML=(type==='loading'?'<span class="amn-spinner"></span>':'')+
      String(message||'');
    if(!keep) hideTimer=setTimeout(()=>status.className='',type==='error'?4200:1900);
  }
  window.showAppStatus=function(message,type){
    show(message,type||'success',false);
  };

  function getRequestInfo(input,init){
    let action='';
    let body=init&&typeof init.body==='string'?init.body:'';
    if(body){
      try{ action=JSON.parse(body).action||''; }catch(e){}
    }
    const method=String((init&&init.method)||'GET').toUpperCase();
    const labels=actionLabels[action]||
      (/^(get|list|load|login|validate|check)/i.test(action)
        ?['טוען נתונים…','הנתונים עודכנו ✓']
        :[method==='GET'?'טוען…':'מבצע פעולה…','הפעולה הושלמה ✓']);
    const isRead=method==='GET'||/^(get|list|load|login|validate|check)/i.test(action);
    const url=typeof input==='string'?input:(input&&input.url)||'';
    return {action,method,body,labels,isRead,key:url+'|'+body};
  }

  window.fetch=function(input,init){
    const info=getRequestInfo(input,init||{});
    const activeButton=document.activeElement&&
      document.activeElement.closest?document.activeElement.closest('button,[role="button"]'):null;

    if(info.isRead&&inFlightReads.has(info.key)){
      return inFlightReads.get(info.key).then(r=>r.clone());
    }

    if(activeButton){
      activeButton.classList.add('amn-busy');
      if('disabled' in activeButton) activeButton.disabled=true;
    }
    activeRequests++;
    show(info.labels[0],'loading',true);

    const request=nativeFetch(input,init).then(async response=>{
      let payload=null;
      try{ payload=await response.clone().json(); }catch(e){}
      if(!response.ok||(payload&&payload.success===false)){
        throw Object.assign(new Error((payload&&payload.error)||'הפעולה לא הושלמה'),{response});
      }
      show(info.labels[1],'success',false);
      return response;
    }).catch(err=>{
      show((err&&err.message)||'אירעה תקלה. אפשר לנסות שוב.','error',false);
      throw err;
    }).finally(()=>{
      activeRequests=Math.max(0,activeRequests-1);
      if(activeButton){
        activeButton.classList.remove('amn-busy');
        if('disabled' in activeButton) activeButton.disabled=false;
      }
      if(info.isRead) setTimeout(()=>inFlightReads.delete(info.key),500);
    });

    if(info.isRead) inFlightReads.set(info.key,request);
    else inFlightReads.clear();
    return info.isRead?request.then(r=>r.clone()):request;
  };

  window.addEventListener('offline',()=>show('אין חיבור לאינטרנט','error',false));
  window.addEventListener('online',()=>show('החיבור חזר ✓','success',false));
})();
</script>

</body></html>
