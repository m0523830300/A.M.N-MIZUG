<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מרכז עבודה למזכירה — א.מ.ן</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6f9;color:#15324c}.head{background:#153e6f;color:#fff;padding:18px}.head h1{margin:0;font-size:22px}.wrap{max-width:1120px;margin:auto;padding:14px}.card,.stat{background:#fff;border:1px solid #d9e4ec;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 2px 9px #0000000c}.login{max-width:390px;margin:70px auto}.login input{font-size:22px;text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{margin:0}.stat.click{cursor:pointer}.stat.click:hover{border-color:#153e6f}.stat b{display:block;font-size:25px;color:#153e6f}.tabs{display:flex;gap:7px;overflow:auto;margin:13px 0}.tabs button{white-space:nowrap}.title{font-size:19px;font-weight:800;margin-bottom:9px}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #c8d5df;border-radius:9px;font:inherit;margin-top:5px}label{display:block;font-weight:700;font-size:13px;margin-top:8px}button,.btn{border:0;border-radius:9px;background:#153e6f;color:#fff;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.6;cursor:wait}.green{background:#067647}.orange{background:#b54708}.item{border-top:1px solid #e5edf2;padding:12px 0}.item:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:10px}.money{font-weight:800;font-size:18px}.badge{background:#eaf1f7;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.hidden{display:none}.toast{position:fixed;bottom:15px;right:15px;left:15px;background:#102a43;color:#fff;padding:13px;border-radius:10px;text-align:center;display:none;z-index:10}.customer-picker{display:grid;grid-template-columns:1fr 2fr;gap:12px;align-items:end}.customer-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.summary-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.summary-box{padding:12px;border-radius:12px;background:#eef4f8}.summary-box strong{display:block;font-size:22px;margin-top:4px}.summary-box.debt{background:#fff0ef;color:#9f261d}.summary-box.good{background:#eaf7ef;color:#076b3b}.doc{border:1px solid #dbe5ec;border-radius:12px;padding:12px;margin:9px 0}.doc.open{border-right:5px solid #c4322b}.doc.paid{border-right:5px solid #13834e}.doc-title{display:flex;justify-content:space-between;gap:10px;align-items:center}.doc-items{margin-top:10px;padding-top:8px;border-top:1px solid #e8eef2}.doc-item{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:6px 0}.timeline{border-right:3px solid #cfe0eb;margin-right:8px;padding-right:15px}.timeline .item{position:relative}.timeline .item:before{content:'';position:absolute;right:-21px;top:16px;width:9px;height:9px;border-radius:50%;background:#153e6f}.loading{text-align:center;padding:35px;color:#64748b}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid,.customer-picker,.summary-cards{grid-template-columns:1fr}.customer-head{display:block}.doc-item{grid-template-columns:1fr}}
</style></head><body>
<div class="head"><h1>מרכז עבודה למזכירה</h1><div id="who">א.מ.ן מיזוג אוויר</div></div><div class="wrap">
<section id="login" class="card login"><div class="title">כניסה למערכת</div><label>קוד אישי</label><input id="pin" type="password" inputmode="numeric" maxlength="8"><button style="width:100%;margin-top:12px" onclick="login()">כניסה</button><div id="loginMsg" class="muted"></div></section>
<main id="app" class="hidden">
<div class="stats"><div class="stat click" onclick="show('collection')"><span>חובות פתוחים</span><b id="sDebts">0</b></div><div class="stat click" onclick="openTodayTasks()"><span>מעקבים להיום</span><b id="sFollow">0</b></div><div class="stat click" onclick="openTasks(false)"><span>משימות פתוחות</span><b id="sTasks">0</b></div><div class="stat click" onclick="show('approval')"><span>ממתין לאישור</span><b id="sApprovals">0</b></div></div>
<div class="tabs"><button onclick="show('today')">היום</button><button onclick="show('collection')">גבייה</button><button onclick="show('taskNew')">משימה חדשה</button><button onclick="openTasks(false)">משימות קיימות</button><button onclick="show('approval')">אישור בעל העסק</button></div>
<section id="today" class="view"><div class="card"><div class="title">סדר העבודה להיום</div><div id="todayList"></div></div></section>
<section id="collection" class="view hidden"><div class="card"><div class="title">מרכז גבייה</div><div class="summary-cards"><div class="summary-box">לקוחות עם יתרה סופית<strong id="collectionCount">0</strong></div><div class="summary-box debt">סה״כ יתרה סופית<strong id="collectionTotal">0 ₪</strong></div><div class="summary-box">דורשים תמחור<strong id="collectionPricing">0</strong></div></div><div class="customer-picker"><label>חיפוש מהיר<input id="search" placeholder="שם או טלפון..." oninput="renderCustomerOptions()"></label><label>בחירת לקוח<select id="customerSelect" onchange="openCustomer(this.value)"><option value="">יש לבחור לקוח</option></select></label></div></div><div id="customerWorkspace" class="hidden"></div></section>
<section id="taskNew" class="view hidden"><div class="card"><div class="title">משימה חדשה</div><div class="grid"><label>תחום<select id="tCategory"><option>גבייה</option><option>תשלומים ומסמכים</option><option>שעות עובדים</option><option>הנהלת חשבונות</option><option>משימה שוטפת</option></select></label><label>עדיפות<select id="tPriority"><option>רגיל</option><option>גבוה</option><option>דחוף</option></select></label><label>מופנה אל<input id="tOwner" placeholder="שם האחראי לביצוע"></label><label>אופן ביצוע<select id="tWorkMode"><option>משרד</option><option>טלפון</option><option>מחשב</option><option>נסיעה/חוץ</option></select></label></div><label>המשימה<input id="tTitle"></label><label>הפעולה הבאה<input id="tNext"></label><div class="grid"><label>תאריך יעד<input id="tDue" type="date"></label><label>מועד מעקב<input id="tFollow" type="date"></label></div><label>לקוח<input id="tReference"></label><button id="saveTaskBtn" class="green" style="margin-top:10px" onclick="saveTask()">שמירת משימה</button></div></section>
<section id="taskExisting" class="view hidden"><div class="card"><div class="title" id="taskListTitle">משימות קיימות</div><div id="taskList"></div></div></section>
<section id="approval" class="view hidden"><div class="card"><div class="title">העברה להחלטת בעל העסק</div><div class="grid"><label>תחום<select id="aCategory"><option>גבייה</option><option>הנחה/זיכוי</option><option>שעות עובדים</option><option>הוצאה חריגה</option><option>אחר</option></select></label><label>לקוח/עובד<input id="aSubject"></label></div><label>מה קרה<textarea id="aEvent"></textarea></label><label>מה כבר נבדק או בוצע<textarea id="aChecked"></textarea></label><label>אילו אפשרויות קיימות<textarea id="aOptions"></textarea></label><label>המלצה להמשך<textarea id="aRecommendation"></textarea></label><label>סכום, אם רלוונטי<input id="aAmount" type="number"></label><button class="orange" style="margin-top:10px" onclick="requestApproval()">שליחה לאישור</button></div><div class="card"><div class="title">בקשות אחרונות</div><div id="approvalList"></div></div></section>
</main></div><div id="toast" class="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbw0fAfYyK9gfViAaVFs0G1HPNguFjdAU4bDt6HCIs_LuOzKuu8lKIM0mLP48gIfeZ-Kwg/exec',$=id=>document.getElementById(id);let token=localStorage.getItem('secretaryToken')||'',data={collections:{customers:[]},tasks:[],approvals:[],summary:{}},savingTask=false,selectedCustomerName='';
async function post(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2800)}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(x){return Number(x||0).toLocaleString('he-IL')+' ₪'}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden')}
async function login(){const r=await post({action:'secretaryLogin',pin:$('pin').value});if(!r.success)return $('loginMsg').textContent=r.error;token=r.token;localStorage.setItem('secretaryToken',token);load()}
async function load(){if(!token)return;const r=await post({action:'secretaryDashboard',secretaryToken:token});if(!r.success){localStorage.removeItem('secretaryToken');token='';$('login').classList.remove('hidden');$('app').classList.add('hidden');$('loginMsg').textContent=r.error;return}data=r;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=r.name+' · א.מ.ן מיזוג אוויר';$('sDebts').textContent=r.summary.debts;$('sFollow').textContent=r.summary.followUps;$('sTasks').textContent=r.summary.openTasks;$('sApprovals').textContent=r.summary.approvals;$('collectionCount').textContent=r.collections.summary?.count||0;$('collectionTotal').textContent=money(r.collections.summary?.totalFinal||0);$('collectionPricing').textContent=r.collections.summary?.needsPricing||0;renderCustomerOptions();renderApprovals();renderToday()}
function renderToday(){const today=new Date().toISOString().slice(0,10),due=data.tasks.filter(t=>t.status!=='הושלם'&&t.followUpDate&&t.followUpDate<=today);$('todayList').innerHTML=`<div class="item"><b>${data.collections.summary?.count||0} לקוחות עם חוב פתוח</b></div><div class="item"><b>${due.length} משימות למעקב היום</b></div><div class="item"><b>${data.approvals.filter(a=>a.status==='ממתין').length} נושאים ממתינים להחלטה</b></div>`}
function openTasks(todayOnly){show('taskExisting');$('taskListTitle').textContent=todayOnly?'מעקבים להיום':'משימות קיימות';renderTasks(todayOnly)}function openTodayTasks(){openTasks(true)}
function renderTasks(todayOnly){const today=new Date().toISOString().slice(0,10);let rows=data.tasks.filter(t=>t.status!=='הושלם');if(todayOnly)rows=rows.filter(t=>t.followUpDate&&t.followUpDate<=today);$('taskList').innerHTML=rows.map(t=>`<div class="item"><div class="row"><div><b>${esc(t.title)}</b><div class="muted">${esc(t.category)} · מעקב ${esc(t.followUpDate||'לא נקבע')}</div></div><span class="badge">${esc(t.priority)} · ${esc(t.status)}</span></div><div class="muted">הפעולה הבאה: ${esc(t.nextAction||'לא הוגדרה')}</div><div class="actions"><button class="green" onclick="finishTask('${t.id}',this)">סמן כהושלם</button></div></div>`).join('')||'<div class="muted">אין משימות להצגה.</div>'}
async function saveTask(){if(savingTask)return;const b=$('saveTaskBtn');savingTask=true;b.disabled=true;b.textContent='שומר...';try{const r=await post({action:'secretarySaveTask',secretaryToken:token,category:$('tCategory').value,priority:$('tPriority').value,owner:$('tOwner').value,workMode:$('tWorkMode').value,title:$('tTitle').value,nextAction:$('tNext').value,dueDate:$('tDue').value,followUpDate:$('tFollow').value,reference:$('tReference').value});toast(r.success?(r.duplicate?'המשימה כבר נשמרה':'המשימה נשמרה ✓'):r.error);if(r.success){await load();openTasks(false)}}finally{savingTask=false;b.disabled=false;b.textContent='שמירת משימה'}}
async function finishTask(id,b){b.disabled=true;const r=await post({action:'secretaryUpdateTask',secretaryToken:token,id,status:'הושלם'});toast(r.success?'המשימה הושלמה ✓':r.error);if(r.success){await load();openTasks(false)}else b.disabled=false}
function filteredCustomers(){const q=($('search')?.value||'').trim();return(data.collections.customers||[]).filter(c=>!q||c.name.includes(q)||c.phone1.includes(q)||c.phone2?.includes(q))}
function renderCustomerOptions(){const selected=$('customerSelect')?.value||'',rows=filteredCustomers();$('customerSelect').innerHTML='<option value="">יש לבחור לקוח ('+rows.length+')</option>'+rows.map(c=>`<option value="${esc(c.name)}">${esc(c.name)} · ${money(c.amount)}</option>`).join('');if(rows.some(c=>c.name===selected))$('customerSelect').value=selected}
async function openCustomer(name){selectedCustomerName=name;if(!name){$('customerWorkspace').classList.add('hidden');return}$('customerWorkspace').classList.remove('hidden');$('customerWorkspace').innerHTML='<div class="card loading">טוען את תיק הלקוח...</div>';const r=await post({action:'secretaryCustomerDetails',secretaryToken:token,customerName:name});if(!r.success){$('customerWorkspace').innerHTML='<div class="card">'+esc(r.error)+'</div>';return}renderCustomerWorkspace(r)}
function renderCustomerWorkspace(r){const c=r.customer,openDocs=r.documents.filter(d=>d.paymentStatus!=='שולם'),paidDocs=r.documents.filter(d=>d.paymentStatus==='שולם'),pricingWarning=c.unpricedCount?`<div class="orange" style="color:#fff;padding:10px;border-radius:9px;margin-top:10px">${c.unpricedCount} עבודות לפני תמחור אינן כלולות ביתרה הסופית</div>`:'';$('customerWorkspace').innerHTML=`<div class="card"><div class="customer-head"><div><div class="title">${esc(c.name)}</div><div class="muted">${esc(c.address||'אין כתובת')} · ${esc(c.phone1||'אין טלפון')}</div></div><div class="actions"><a class="btn" href="tel:${esc(c.phone1)}">התקשר</a><button onclick="$('callForm').classList.toggle('hidden')">עדכון שיחה</button></div></div><div class="summary-cards"><div class="summary-box debt">יתרה סופית לגבייה<strong>${money(c.finalBalance)}</strong></div><div class="summary-box">מסמכים פתוחים<strong>${openDocs.length}</strong></div><div class="summary-box good">מסמכים ששולמו<strong>${paidDocs.length}</strong></div></div>${pricingWarning}</div><div id="callForm" class="card hidden"><div class="title">עדכון שיחה</div><div class="grid"><label>עם מי דובר<input id="cp"></label><label>סטטוס<select id="cs"><option>נוצר קשר</option><option>הבטיח תשלום</option><option>לא זמין</option><option>מחלוקת</option><option>שולם</option></select></label><label>סכום שהובטח<input id="ca" type="number"></label><label>מועד מעקב<input id="cd" type="date"></label></div><label>מה סוכם<textarea id="cn"></textarea></label><button class="green" onclick="saveSelectedCollection()">שמירת העדכון</button></div><div class="card"><div class="title">מסמכים ועבודות</div>${r.documents.map(renderDocument).join('')||'<div class="muted">לא נמצאו מסמכים.</div>'}</div><div class="card"><div class="title">שיחות והתחייבויות קודמות</div><div class="timeline">${r.history.map(h=>`<div class="item"><div class="row"><b>${esc(h.status||'עדכון')}</b><span class="muted">${esc(h.date)}</span></div><div>${esc(h.note||'לא נכתב סיכום')}</div><div class="muted">${h.promisedAmount?'התחייבות: '+money(h.promisedAmount)+' · ':''}${h.followUpDate?'מעקב: '+esc(h.followUpDate):''}</div></div>`).join('')||'<div class="muted">עדיין אין שיחות מתועדות.</div>'}</div></div>`}
function toggleDocument(button){const details=button.closest('.doc').querySelector('.doc-items');const opening=details.classList.contains('hidden');details.classList.toggle('hidden');button.textContent=opening?'סגירת פירוט':'פתיחת המסמך'}
function renderDocument(d){const paid=d.paymentStatus==='שולם';return `<div class="doc ${paid?'paid':'open'}"><div class="doc-title"><div><b>מסמך ${esc(d.number)}</b><div class="muted">${esc(d.date)} · ${esc(d.project||d.workType||'')}</div></div><div><span class="badge">${esc(d.paymentStatus||'לבדיקה')}</span> <span class="money">${money(d.amount)}</span></div></div><div class="actions"><button type="button" onclick="toggleDocument(this)">פתיחת המסמך</button></div><div class="doc-items hidden">${(d.items||[]).map(x=>`<div class="doc-item"><span>${esc(x.description)}</span><span>${x.quantity} יח׳</span><b>${money(x.total)}</b></div>`).join('')||'<div class="muted">המסמך נמצא, אך אין בו שורות פירוט להצגה.</div>'}</div></div>`}
async function saveSelectedCollection(){const c=(data.collections.customers||[]).find(x=>x.name===selectedCustomerName);if(!c)return toast('לא נבחר לקוח');const r=await post({action:'secretarySaveCollection',secretaryToken:token,customerName:c.name,phone:c.phone1,email:c.email,amount:c.amount,amountIsFinal:c.amountIsFinal,contactPerson:$('cp').value,status:$('cs').value,promisedAmount:$('ca').value,followUpDate:$('cd').value,note:$('cn').value,channel:'טלפון'});toast(r.success?'השיחה תועדה ✓':r.error);if(r.success)openCustomer(selectedCustomerName)}
function renderApprovals(){$('approvalList').innerHTML=data.approvals.slice(0,20).map(a=>`<div class="item"><div class="row"><b>${esc(a.subject||a.category)}</b><span class="badge">${esc(a.status)}</span></div><div>${esc(a.event)}</div><div class="muted">המלצה: ${esc(a.recommendation||'לא נרשמה')}</div></div>`).join('')||'<div class="muted">אין בקשות.</div>'}async function requestApproval(){const r=await post({action:'secretaryRequestApproval',secretaryToken:token,category:$('aCategory').value,subject:$('aSubject').value,event:$('aEvent').value,checked:$('aChecked').value,options:$('aOptions').value,recommendation:$('aRecommendation').value,amount:$('aAmount').value});toast(r.success?'נשלח לאישור בעל העסק ✓':r.error);if(r.success)load()}
load();
</script></body></html>
