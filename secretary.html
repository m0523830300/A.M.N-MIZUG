<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>מרכז עבודה למזכירה — א.מ.ן</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f6f9;color:#15324c}.head{background:#153e6f;color:#fff;padding:18px}.head h1{margin:0;font-size:22px}.wrap{max-width:1050px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d9e4ec;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 2px 9px #0000000c}.login{max-width:390px;margin:70px auto}.login input{font-size:22px;text-align:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#fff;border-radius:13px;padding:14px;border:1px solid #d9e4ec}.stat b{display:block;font-size:25px;color:#153e6f}.tabs{display:flex;gap:7px;overflow:auto;margin:13px 0}.tabs button{white-space:nowrap}.title{font-size:19px;font-weight:800;margin-bottom:9px}.muted{color:#64748b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #c8d5df;border-radius:9px;font:inherit;margin-top:5px}label{display:block;font-weight:700;font-size:13px;margin-top:8px}button,.btn{border:0;border-radius:9px;background:#153e6f;color:#fff;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.green{background:#067647}.orange{background:#b54708}.gray{background:#64748b}.item{border-top:1px solid #e5edf2;padding:12px 0}.item:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.money{font-weight:800;font-size:18px}.badge{background:#eaf1f7;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.hidden{display:none}.toast{position:fixed;bottom:15px;right:15px;left:15px;background:#102a43;color:#fff;padding:13px;border-radius:10px;text-align:center;display:none;z-index:10}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style></head><body><div class="head"><h1>מרכז עבודה למזכירה</h1><div id="who">א.מ.ן מיזוג אוויר</div></div><div class="wrap">
<section id="login" class="card login"><div class="title">כניסה למערכת</div><label>קוד אישי</label><input id="pin" type="password" inputmode="numeric" maxlength="8"><button style="width:100%;margin-top:12px" onclick="login()">כניסה</button><div id="loginMsg" class="muted"></div></section>
<main id="app" class="hidden"><div class="stats"><div class="stat"><span>חובות פתוחים</span><b id="sDebts">0</b></div><div class="stat"><span>מעקבים להיום</span><b id="sFollow">0</b></div><div class="stat"><span>משימות פתוחות</span><b id="sTasks">0</b></div><div class="stat"><span>ממתין לאישור</span><b id="sApprovals">0</b></div></div>
<div class="tabs"><button onclick="show('today')">היום</button><button onclick="show('collection')">גבייה</button><button onclick="show('tasks')">משימות</button><button onclick="show('approval')">אישור בעל העסק</button></div>
<section id="today" class="view"><div class="card"><div class="title">סדר העבודה להיום</div><div id="todayList"></div></div></section>
<section id="collection" class="view hidden"><div class="card"><div class="title">מרכז גבייה</div><input id="search" placeholder="חיפוש לקוח..." oninput="renderCollections()"><div id="collectionList"></div></div></section>
<section id="tasks" class="view hidden"><div class="card"><div class="title">משימה חדשה</div><div class="grid"><label>תחום<select id="tCategory"><option>גבייה</option><option>תשלומים ומסמכים</option><option>שעות עובדים</option><option>הנהלת חשבונות</option><option>משימה שוטפת</option></select></label><label>עדיפות<select id="tPriority"><option>רגיל</option><option>גבוה</option><option>דחוף</option></select></label></div><label>המשימה<input id="tTitle"></label><label>הפעולה הבאה<input id="tNext"></label><div class="grid"><label>תאריך יעד<input id="tDue" type="date"></label><label>מועד מעקב<input id="tFollow" type="date"></label></div><label>לקוח/קישור<input id="tReference"></label><button class="green" style="margin-top:10px" onclick="saveTask()">שמירת משימה</button></div><div class="card"><div class="title">משימות פתוחות</div><div id="taskList"></div></div></section>
<section id="approval" class="view hidden"><div class="card"><div class="title">העברה להחלטת בעל העסק</div><div class="grid"><label>תחום<select id="aCategory"><option>גבייה</option><option>הנחה/זיכוי</option><option>שעות עובדים</option><option>הוצאה חריגה</option><option>אחר</option></select></label><label>לקוח/עובד<input id="aSubject"></label></div><label>מה קרה<textarea id="aEvent"></textarea></label><label>מה כבר נבדק או בוצע<textarea id="aChecked"></textarea></label><label>אילו אפשרויות קיימות<textarea id="aOptions"></textarea></label><label>המלצה להמשך<textarea id="aRecommendation"></textarea></label><label>סכום, אם רלוונטי<input id="aAmount" type="number"></label><button class="orange" style="margin-top:10px" onclick="requestApproval()">שליחה לאישור</button></div><div class="card"><div class="title">בקשות אחרונות</div><div id="approvalList"></div></div></section></main></div><div id="toast" class="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbw0fAfYyK9gfViAaVFs0G1HPNguFjdAU4bDt6HCIs_LuOzKuu8lKIM0mLP48gIfeZ-Kwg/exec', $=id=>document.getElementById(id);let token=localStorage.getItem('secretaryToken')||'',data={collections:{customers:[]},tasks:[],approvals:[],summary:{}};
async function post(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2800)}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(x){return Number(x||0).toLocaleString('he-IL')+' ₪'}
async function login(){const r=await post({action:'secretaryLogin',pin:$('pin').value});if(!r.success)return $('loginMsg').textContent=r.error;token=r.token;localStorage.setItem('secretaryToken',token);load()}
async function load(){if(!token)return;const r=await post({action:'secretaryDashboard',secretaryToken:token});if(!r.success){localStorage.removeItem('secretaryToken');token='';$('login').classList.remove('hidden');$('app').classList.add('hidden');$('loginMsg').textContent=r.error;return}data=r;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=r.name+' · א.מ.ן מיזוג אוויר';$('sDebts').textContent=r.summary.debts;$('sFollow').textContent=r.summary.followUps;$('sTasks').textContent=r.summary.openTasks;$('sApprovals').textContent=r.summary.approvals;renderCollections();renderTasks();renderApprovals();renderToday()}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden')}
function renderToday(){const today=new Date().toISOString().slice(0,10),due=data.tasks.filter(t=>t.status!=='הושלם'&&t.followUpDate&&t.followUpDate<=today);$('todayList').innerHTML=`<div class="item"><b>${data.collections.summary?.count||0} לקוחות עם חוב פתוח</b><div class="muted">יש לעבור על רשימת הגבייה ולתעד כל שיחה.</div></div><div class="item"><b>${due.length} משימות למעקב היום</b><div class="muted">לכל משימה יש לעדכן פעולה הבאה ומועד המשך.</div></div><div class="item"><b>${data.approvals.filter(a=>a.status==='ממתין').length} נושאים ממתינים להחלטה</b></div>`}
function renderCollections(){const q=($('search')?.value||'').trim();const rows=(data.collections.customers||[]).filter(c=>!q||c.name.includes(q)||c.phone1.includes(q));$('collectionList').innerHTML=rows.map((c,i)=>`<div class="item"><div class="row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.phone1)} · מסמך ${esc(c.lastDocumentNumber)}</div></div><div class="money">${money(c.amount)}</div></div><div class="actions"><a class="btn" href="tel:${esc(c.phone1)}">התקשר</a><button onclick="openCollection(${i})">תיעוד שיחה</button><span class="badge">${c.amountIsFinal?'סכום סופי':'לפני תמחור'}</span></div><div id="cf_${i}" class="hidden"><div class="grid"><label>עם מי דובר<input id="cp_${i}"></label><label>סטטוס<select id="cs_${i}"><option>נוצר קשר</option><option>הבטיח תשלום</option><option>לא זמין</option><option>מחלוקת</option><option>שולם</option></select></label><label>סכום שהובטח<input id="ca_${i}" type="number"></label><label>מועד מעקב<input id="cd_${i}" type="date"></label></div><label>סיכום השיחה<textarea id="cn_${i}"></textarea></label><button class="green" onclick="saveCollection(${i})">שמירה</button></div></div>`).join('')||'<div class="muted">אין תוצאות.</div>'}
function openCollection(i){$('cf_'+i).classList.toggle('hidden')}async function saveCollection(i){const c=(data.collections.customers||[]).filter(x=>{const q=($('search')?.value||'').trim();return !q||x.name.includes(q)||x.phone1.includes(q)})[i];const r=await post({action:'secretarySaveCollection',secretaryToken:token,customerName:c.name,phone:c.phone1,email:c.email,amount:c.amount,amountIsFinal:c.amountIsFinal,contactPerson:$('cp_'+i).value,status:$('cs_'+i).value,promisedAmount:$('ca_'+i).value,followUpDate:$('cd_'+i).value,note:$('cn_'+i).value,channel:'טלפון'});toast(r.success?'השיחה תועדה ✓':r.error);if(r.success)load()}
function renderTasks(){$('taskList').innerHTML=data.tasks.map(t=>`<div class="item"><div class="row"><div><b>${esc(t.title)}</b><div class="muted">${esc(t.category)} · מעקב ${esc(t.followUpDate||'לא נקבע')}</div></div><span class="badge">${esc(t.status)}</span></div><div class="muted">הפעולה הבאה: ${esc(t.nextAction||'לא הוגדרה')}</div>${t.status!=='הושלם'?`<div class="actions"><button class="green" onclick="finishTask('${t.id}')">סמן כהושלם</button></div>`:''}</div>`).join('')||'<div class="muted">אין משימות.</div>'}
async function saveTask(){const r=await post({action:'secretarySaveTask',secretaryToken:token,category:$('tCategory').value,priority:$('tPriority').value,title:$('tTitle').value,nextAction:$('tNext').value,dueDate:$('tDue').value,followUpDate:$('tFollow').value,reference:$('tReference').value});toast(r.success?'המשימה נשמרה ✓':r.error);if(r.success)load()}async function finishTask(id){const r=await post({action:'secretaryUpdateTask',secretaryToken:token,id,status:'הושלם'});toast(r.success?'המשימה הושלמה ✓':r.error);if(r.success)load()}
function renderApprovals(){$('approvalList').innerHTML=data.approvals.slice(0,20).map(a=>`<div class="item"><div class="row"><b>${esc(a.subject||a.category)}</b><span class="badge">${esc(a.status)}</span></div><div>${esc(a.event)}</div><div class="muted">המלצה: ${esc(a.recommendation||'לא נרשמה')}</div></div>`).join('')||'<div class="muted">אין בקשות.</div>'}async function requestApproval(){const r=await post({action:'secretaryRequestApproval',secretaryToken:token,category:$('aCategory').value,subject:$('aSubject').value,event:$('aEvent').value,checked:$('aChecked').value,options:$('aOptions').value,recommendation:$('aRecommendation').value,amount:$('aAmount').value});toast(r.success?'נשלח לאישור בעל העסק ✓':r.error);if(r.success)load()}
load();
</script></body></html>
