<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153e6f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="א.מ.ן מתקינים"><link rel="apple-touch-icon" href="icon-technician-192.png"><link rel="manifest" href="manifest-installer.json"><title>עבודות מתקינים — א.מ.ן</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f6f9;color:#102a43}.head{position:sticky;top:0;z-index:5;background:#153e6f;color:white;padding:15px}.head h1{font-size:21px;margin:0}.head small{display:block;margin-top:4px}.wrap{max-width:720px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d9e3ec;border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000b}.jobtop{display:flex;align-items:center;gap:10px}.num{background:#153e6f;color:#fff;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:21px;font-weight:bold}.title{font-size:19px;font-weight:800}.meta{color:#5d7285;line-height:1.65;margin-top:7px}.items{padding-right:20px;line-height:1.7}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}button,.btn{border:0;border-radius:10px;background:#153e6f;color:#fff;padding:12px;font-size:16px;font-weight:800;text-align:center;text-decoration:none}.green{background:#067647}.gray{background:#64748b}.full{grid-column:1/-1}textarea,input{width:100%;padding:11px;border:1px solid #cbd8e3;border-radius:9px;font:inherit;margin-top:8px}.hidden{display:none}.status{display:inline-block;border-radius:99px;background:#e8f0f7;padding:5px 10px;font-weight:700}.toast{position:fixed;bottom:18px;right:15px;left:15px;background:#102a43;color:white;padding:13px;border-radius:10px;text-align:center;display:none}.empty{text-align:center;padding:30px;color:#64748b}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;position:sticky;top:76px;z-index:4;background:#f2f6f9;padding:4px 0}.tab{background:#dce7f0;color:#153e6f}.tab.active{background:#153e6f;color:#fff}.attendance-status{text-align:center;padding:14px;border-radius:12px;background:#edf3f7;color:#153e6f;font-weight:800;margin:10px 0}.attendance-status.in{background:#e7f6ed;color:#067647}.attendance-actions{display:grid;gap:10px}.out{background:#b7352a}.note{font-size:13px;color:#60737c;line-height:1.5}.ios-safe{padding-bottom:max(18px,env(safe-area-inset-bottom))}select{width:100%;padding:11px;border:1px solid #cbd8e3;border-radius:9px;font:inherit;margin-top:8px;background:#fff}@media(max-width:480px){.head{padding-top:max(15px,env(safe-area-inset-top))}.wrap{padding:10px}.card{border-radius:13px;padding:12px}.actions{grid-template-columns:1fr 1fr}button,.btn{min-height:48px;font-size:16px}.tabs{top:78px}}
</style></head><body><div class="head"><h1>עבודות מתקינים</h1><small id="who">טוען…</small></div><div class="wrap ios-safe"><div class="tabs"><button id="jobsTab" class="tab active" onclick="showView('jobs')">העבודות שלי</button><button id="attendanceTab" class="tab" onclick="showView('attendance')">נוכחות</button></div><section id="jobsView"><div class="card"><label>תאריך עבודה</label><input id="date" type="date"></div><div id="jobs"></div></section><section id="attendanceView" class="hidden"><div class="card"><h2 style="margin-top:0">כניסה ויציאה</h2><div id="attendanceStatus" class="attendance-status">בודק מצב…</div><div class="attendance-actions"><button id="clockInBtn" class="green" onclick="clockIn()">כניסה לעבודה</button><div id="clockOutBox" class="hidden"><label>מה בוצע היום? (חובה)</label><textarea id="daySummary" placeholder="אפשר לכתוב או להשתמש במיקרופון של המקלדת"></textarea><label>שעת יציאה</label><input id="outTime" type="time"><button id="clockOutBtn" class="out" onclick="clockOut()">סיום ושמירת יציאה</button></div></div><p class="note">הכניסה והיציאה נשמרות בגיליון הנוכחות הרגיל.</p></div></section></div><div id="toast" class="toast"></div><script>
const API='https://script.google.com/macros/s/AKfycbw0fAfYyK9gfViAaVFs0G1HPNguFjdAU4bDt6HCIs_LuOzKuu8lKIM0mLP48gIfeZ-Kwg/exec';const $=id=>document.getElementById(id);let token=new URLSearchParams(location.search).get('token')||localStorage.getItem('installerToken')||'';if(token)localStorage.setItem('installerToken',token);$('date').value=new Date().toISOString().slice(0,10);async function post(x){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(x)});return r.json()}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}
function showView(view){const jobs=view==='jobs';$('jobsView').classList.toggle('hidden',!jobs);$('attendanceView').classList.toggle('hidden',jobs);$('jobsTab').classList.toggle('active',jobs);$('attendanceTab').classList.toggle('active',!jobs);if(!jobs)loadAttendance()}let cachedLocation=null;function locationNow(){if(cachedLocation&&Date.now()-cachedLocation.savedAt<30000&&cachedLocation.accuracy<=250)return Promise.resolve(cachedLocation);return new Promise((resolve,reject)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{cachedLocation={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:Math.round(p.coords.accuracy),savedAt:Date.now()};if(cachedLocation.accuracy>1500)return reject(Error('המיקום אינו מדויק. יש להפעיל מיקום מדויק ולנסות שוב'));resolve(cachedLocation)},()=>reject(Error('יש לאשר לדפדפן גישה למיקום מדויק')),{enableHighAccuracy:true,timeout:15000,maximumAge:0}):reject(Error('אין תמיכה במיקום')))}function paintAttendance(inside,inTime=''){$('attendanceStatus').textContent=inside?'בעבודה מאז '+inTime:'לא רשומה כניסה להיום';$('attendanceStatus').classList.toggle('in',inside);$('clockInBtn').classList.toggle('hidden',inside);$('clockOutBox').classList.toggle('hidden',!inside)}async function loadAttendance(){if(!token)return;try{const r=await post({action:'attendanceStatus',token});if(!r.success)throw Error(r.error);paintAttendance(!!r.clockedIn,r.inTime||'')}catch(e){toast(e.message||'לא ניתן לטעון את מצב הנוכחות')}}async function clockIn(){const b=$('clockInBtn');try{b.disabled=true;b.textContent='שומר כניסה…';const loc=await locationNow();const r=await post({action:'attendanceClockIn',token,location:loc});if(!r.success)throw Error(r.error);paintAttendance(true,new Date().toTimeString().slice(0,5));toast('הכניסה נשמרה ✓')}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='כניסה לעבודה'}}async function clockOut(){const summary=$('daySummary').value.trim();if(!summary)return toast('חובה לפרט מה בוצע היום');const b=$('clockOutBtn');try{b.disabled=true;b.textContent='שומר יציאה…';const loc=await locationNow();const r=await post({action:'attendanceClockOut',token,summary,outTime:$('outTime').value,location:loc});if(!r.success)throw Error(r.error);paintAttendance(false,'');$('daySummary').value='';toast('היציאה נשמרה ✓')}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='סיום ושמירת יציאה'}}async function load(){if(!token){$('jobs').innerHTML='<div class="card empty">יש להיכנס דרך הקישור האישי של העובד.</div>';return}try{const r=await post({action:'installerJobs',token,date:$('date').value});if(!r.success)throw Error(r.error);$('who').textContent=r.name+' · '+r.team;render(r.jobs||[])}catch(e){$('jobs').innerHTML='<div class="card empty">'+esc(e.message)+'</div>'}}
function acUnits(items){const out=[];(items||[]).filter(x=>/מזגן|MULTI|SRK|GOLD|INV|TOP|MASTER/i.test(x.name)&&!/עבודה|התקנה|תוספת|הנמכה|סגירת/i.test(x.name)).forEach(x=>{for(let n=1;n<=x.qty;n++)out.push({item:x.name,unit:n,pipe:x.pipe||''})});return out}
function pipeFields(j){return acUnits(j.items).map((x,i)=>`<div class="card" style="background:#f7fafc"><b>${esc(x.item)} — יחידה ${x.unit}</b><label>מידת צנרת</label><select id="p_${j.id}_${i}"><option value="">בחירה ידנית</option>${['1/4–3/8','1/4–1/2','1/4–5/8','3/8–5/8','3/8–3/4','3/8–1'].map(p=>`<option ${p===x.pipe?'selected':''}>${p}</option>`).join('')}</select><label>אורך שהותקן בפועל במטרים</label><input id="m_${j.id}_${i}" type="number" min="0" step="0.5" placeholder="לדוגמה: 5"><input type="hidden" id="i_${j.id}_${i}" value="${esc(x.item)}"><input type="hidden" id="u_${j.id}_${i}" value="${x.unit}"></div>`).join('')}
function render(jobs){$('jobs').innerHTML=jobs.map(j=>`<div class="card" id="j_${j.id}" data-units="${acUnits(j.items).length}"><div class="jobtop"><div class="num">${j.order}</div><div><div class="title">${esc(j.customer)}</div><span class="status">${esc(j.status)}</span></div></div><div class="meta">מסמך ${esc(j.documentNumber)}${j.project?' · '+esc(j.project):''}<br>${esc(j.address)}</div><ul class="items">${(j.items||[]).map(x=>`<li>${x.qty} × ${esc(x.name)}</li>`).join('')}</ul>${pipeFields(j)}<div class="actions"><a class="btn" href="tel:${esc(j.phone)}">התקשר</a><a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(j.address)}">ניווט</a>${j.status==='מתוכנן'?`<button class="green full" onclick="start('${j.id}')">התחל עבודה</button>`:''}<label class="btn gray full">העלאת תמונה או סרטון<input class="hidden" type="file" accept="image/*,video/*,audio/*" onchange="upload('${j.id}',this)"></label><label class="full">מצב העבודה<select id="st_${j.id}"><option>בוצע</option><option>בוצע חלקית</option><option>נדחה</option><option>בוטל</option></select></label><textarea id="s_${j.id}" placeholder="מה בוצע אצל הלקוח?">${esc(j.summary)}</textarea><button class="green full" onclick="finish('${j.id}')">שלח סיכום לאישור המשרד</button>${j.folderUrl?`<a class="btn gray full" target="_blank" href="${esc(j.folderUrl)}">פתח תיקיית העבודה</a>`:''}</div></div>`).join('')||'<div class="card empty">אין עבודות לצוות בתאריך הזה.</div>'}
async function start(id){const r=await post({action:'installerJobStart',token,id});toast(r.success?'העבודה התחילה ✓':r.error);load()}async function finish(id){const summary=$('s_'+id).value.trim();if(!summary)return toast('חובה לכתוב מה בוצע');const count=Number($('j_'+id).dataset.units||0),pipeEntries=[];for(let i=0;i<count;i++){const meters=$('m_'+id+'_'+i).value;if(meters==='')continue;pipeEntries.push({item:$('i_'+id+'_'+i).value,unit:$('u_'+id+'_'+i).value,pipe:$('p_'+id+'_'+i).value,meters:Number(meters)})}const r=await post({action:'installerJobComplete',token,id,summary,workStatus:$('st_'+id).value,pipeEntries});toast(r.success?'הדיווח נשלח לאישור המשרד ✓':r.error);load()}function upload(id,input){const f=input.files[0];if(!f)return;if(f.size>20*1024*1024){toast('הקובץ גדול מ־20MB');return}toast('מעלה את הקובץ…');const rd=new FileReader();rd.onload=async()=>{const r=await post({action:'installerJobUpload',token,id,fileName:f.name,mimeType:f.type,base64Data:String(rd.result).split(',')[1]});toast(r.success?'הקובץ נשמר ✓':r.error);load()};rd.readAsDataURL(f)}$('date').onchange=load;$('outTime').value=new Date().toTimeString().slice(0,5);load();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>  <script defer src="app-status.js?v=2"></script>
</body></html>
